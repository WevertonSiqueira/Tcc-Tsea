<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análises</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="visao-geral.html">Visão Geral</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Analises.html">Análises</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Configuracao.html">Configurações</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1>Análises</h1>
                    <p class="subtitle">Gráficos e métricas para acompanhar produção e qualidade</p>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Eficiência</h3>
                        <p>87%</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Qualidade</h3>
                        <p>92%</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Taxa de retrabalho</h3>
                        <p>4%</p>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="chart-container">
                        <div class="chart-header">
                            <h2>Produção por Tipo</h2>
                        </div>
                        <canvas id="graficoQualidade"></canvas>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="chart-container">
                        <div class="chart-header">
                            <h2>Tendência de Produção</h2>
                        </div>
                        <canvas id="graficoTendencia"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- Supabase JS (for Supabase client) and config -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
        <script src="supabase-config.js"></script>
        <script src="script.js"></script>
</body>

</html>
