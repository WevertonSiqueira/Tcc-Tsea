<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="visao-geral.html">Visão Geral</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Analises.html">Análises</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Configuracao.html">Configurações</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1>Configurações</h1>
                    <p class="subtitle">Ajuste suas preferências do sistema e dados de usuário</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="dashboard-card">
                        <h3>Perfil do usuário</h3>
                        <form id="configForm">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" id="nome" name="nome" class="form-control" placeholder="Seu nome"
                                    value="Supervisor" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" name="email" class="form-control"
                                    placeholder="seu@email.com" value="supervisor@empresa.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input type="tel" id="telefone" name="telefone" class="form-control"
                                    placeholder="(11) 91234-5678" value="(11) 91234-5678">
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="dashboard-card mb-4">
                        <h3>Preferências do sistema</h3>
                        <div class="mb-3">
                            <label for="tema" class="form-label">Tema</label>
                            <select id="tema" class="form-select">
                                <option value="claro" selected>Claro</option>
                                <option value="escuro">Escuro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="unidade" class="form-label">Unidade de medida</label>
                            <select id="unidade" class="form-select">
                                <option value="kg" selected>Quilogramas (kg)</option>
                                <option value="ton">Toneladas (t)</option>
                            </select>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" value="" id="autoUpdate" checked>
                            <label class="form-check-label" for="autoUpdate">
                                Atualização automática de dados
                            </label>
                        </div>
                    </div>

                    <div class="dashboard-card">
                        <h3>Notificações</h3>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" value="" id="emailAlerts" checked>
                            <label class="form-check-label" for="emailAlerts">
                                Receber alertas por e-mail
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" value="" id="productionAlerts">
                            <label class="form-check-label" for="productionAlerts">
                                Alertas de produção e qualidade
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" value="" id="dailyReport">
                            <label class="form-check-label" for="dailyReport">
                                Enviar relatório diário
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="button" class="btn btn-primary" onclick="salvarConfiguracao()">Salvar alterações</button>
                <button type="button" class="btn btn-secondary" onclick="sair()">Sair</button>
            </div>
        </main>
    </div>

    <!-- Supabase JS (for Supabase client) and config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
