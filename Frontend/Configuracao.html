<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="script.js" defer></script>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="visao-geral.html">Visão Geral</a></li>
                <li><a href="Analises.html">Análises</a></li>
                <li><a href="Dashborad.html">Dashboard</a></li>
                <li><a href="Configuracao.html">Configurações</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <div>
                    <h1>Configurações</h1>
                    <p class="subtitle">Ajuste suas preferências do sistema e dados de usuário</p>
                </div>
            </header>

            <section class="cards config-section">
                <div class="dashboard-card">
                    <h3>Perfil do usuário</h3>
                    <form id="configForm">
                        <div class="input-box mb-3">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Seu nome" value="Supervisor" required>
                        </div>
                        <div class="input-box mb-3">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" value="supervisor@empresa.com" required>
                        </div>
                        <div class="input-box mb-3">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(11) 91234-5678" value="(11) 91234-5678">
                        </div>
                    </form>
                </div>

                <div class="dashboard-card">
                    <h3>Preferências do sistema</h3>
                    <div class="input-box mb-3">
                        <label for="tema">Tema</label>
                        <select id="tema" class="form-select">
                            <option value="claro" selected>Claro</option>
                            <option value="escuro">Escuro</option>
                        </select>
                    </div>
                    <div class="input-box mb-3">
                        <label for="unidade">Unidade de medida</label>
                        <select id="unidade" class="form-select">
                            <option value="kg" selected>Quilogramas (kg)</option>
                            <option value="ton">Toneladas (t)</option>
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="autoUpdate" checked>
                        <label class="form-check-label" for="autoUpdate">
                            Atualização automática de dados
                        </label>
                    </div>
                </div>

                <div class="dashboard-card">
                    <h3>Notificações</h3>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="emailAlerts" checked>
                        <label class="form-check-label" for="emailAlerts">
                            Receber alertas por e-mail
                        </label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="productionAlerts">
                        <label class="form-check-label" for="productionAlerts">
                            Alertas de produção e qualidade
                        </label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="dailyReport">
                        <label class="form-check-label" for="dailyReport">
                            Enviar relatório diário
                        </label>
                    </div>
                </div>
            </section>

            <div class="d-flex gap-2 mt-4">
                <button type="button" class="btn btn-primary" onclick="salvarConfiguracao()">Salvar alterações</button>
                <button type="button" class="btn btn-secondary" onclick="sair()">Sair</button>
            </div>
        </main>
    </div>
</body>

</html>
