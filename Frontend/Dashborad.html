<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="visao-geral.html">Visão Geral</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Analises.html">Análises</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Configuracao.html">Configurações</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1>Dashboard Geral</h1>
                    <p class="subtitle">Visão geral dos lotes, produção e desempenho</p>
                </div>
                <button id="btn-sair" class="btn btn-outline-light btn-sm text-dark">Sair</button>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Total de Lotes</h3>
                        <p>90</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Peso Produzido</h3>
                        <p>2.500 kg</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Produção Hoje</h3>
                        <p>35 lotes</p>
                    </div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">
                    <h2>Produção por Lote</h2>
                </div>
                <canvas id="graficoLotes"></canvas>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
