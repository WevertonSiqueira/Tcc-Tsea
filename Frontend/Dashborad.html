<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="visao-geral.html">Visão Geral</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Analises.html">Análises</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="Configuracao.html">Configurações</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1>Dashboard Geral</h1>
                    <p class="subtitle">Visão geral dos lotes, produção e desempenho</p>
                </div>
                <button id="btn-sair" class="btn btn-outline-light btn-sm text-dark">Sair</button>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Total de Lotes</h3>
                        <p>90</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Peso Produzido</h3>
                        <p>2.500 kg</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="dashboard-card">
                        <h3>Produção Hoje</h3>
                        <p>35 lotes</p>
                    </div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">
                    <h2>Produção por Lote</h2>
                </div>
                <canvas id="graficoLotes"></canvas>
            </div>

            <section class="mt-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h3>Lotes Recentes</h3>
                    <button id="btnNovoLote" class="btn btn-sm btn-success">Novo Lote</button>
                </div>
                <div class="mb-3 d-flex gap-2 filter-controls">
                    <input id="filterSearch" class="form-control form-control-sm" placeholder="Pesquisar por nome..." aria-label="Pesquisar lotes">
                    <select id="filterStatus" class="form-select form-select-sm" aria-label="Filtrar por status">
                        <option value="">Todos os status</option>
                        <option value="pendente">Pendente</option>
                        <option value="pronto">Pronto</option>
                        <option value="em_producao">Em produção</option>
                        <option value="desconhecido">Desconhecido</option>
                    </select>
                    <select id="pageSize" class="form-select form-select-sm" aria-label="Tamanho da página">
                        <option value="5">5 / página</option>
                        <option value="10" selected>10 / página</option>
                        <option value="20">20 / página</option>
                    </select>
                </div>
                <div class="dashboard-card">
                    <div class="table-responsive">
                        <table class="table table-striped" id="lotesTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Peso (kg)</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- lotes serão inseridos aqui -->
                            </tbody>
                        </table>
                    </div>
                    <nav>
                        <ul class="pagination pagination-sm" id="pagination"></ul>
                    </nav>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1FQZ1K/9GqQ8K/0W5Y5n3zv1p3yD4u8e0Q5Q5Y5y5y5" crossorigin="anonymous"></script>
    <!-- Lote modal -->
    <div class="modal fade" id="loteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <form id="loteForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Lote</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="loteId">
                        <div class="mb-2">
                            <label class="form-label">Nome</label>
                            <input id="loteNome" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Peso (kg)</label>
                            <input id="lotePeso" class="form-control" inputmode="decimal">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Status</label>
                            <select id="loteStatus" class="form-select">
                                <option value="pendente">Pendente</option>
                                <option value="pronto">Pronto</option>
                                <option value="em_producao">Em produção</option>
                                <option value="desconhecido">Desconhecido</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
