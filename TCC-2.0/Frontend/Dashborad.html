<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Importação do Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Vinculação correta do seu arquivo de script (deve vir DEPOIS do Chart.js) -->
    <script src="script.js" defer></script>
</head>

<body>

    <div class="dashboard-container">

        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="#">Visão Geral</a></li>
                <li><a href="#">Análises</a></li>
                <li><a href="#">Configurações</a></li>
                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButtonLight" data-bs-toggle="dropdown" aria-expanded="false">
    Adicionar
  </button>
            </ul>
        </aside>

        <main class="main-content">

            <header>
                <h1>Dashboard Geral</h1>
            </header>

            <section class="cards">
                <div class="card">
                    <h3>Total de Lotes</h3>
                    <p>120</p>
                </div>

                <div class="card">
                    <h3>Peso Produzido</h3>
                    <p>2.500 kg</p>
                </div>

                <div class="card">
                    <h3>Produção Hoje</h3>
                    <p>35 lotes</p>
                </div>
            </section>

            <!-- Seção do Gráfico -->
            <section class="grafico">
                <canvas id="graficoLotes"></canvas>
            </section>
            <div> <canvas id= "myChart"></canvas></div>
            
<script>
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
 
        </main>

    </div>

</body>

</html>
